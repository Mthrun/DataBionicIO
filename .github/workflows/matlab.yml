name: MATLAB MEX tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'libs/cDataIO/**'
      - 'libs/matlabDataIO/**'
      - 'ci/matlab/**'
      - '.github/workflows/matlab.yml'
      - '.gitattributes'
  pull_request:
    paths:
      - 'libs/cDataIO/**'
      - 'libs/matlabDataIO/**'
      - 'ci/matlab/**'
      - '.github/workflows/matlab.yml'
      - '.gitattributes'

permissions:
  contents: read

concurrency:
  group: matlab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-mex:
    name: Windows / MATLAB R2024b / C++20
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Record runner environment
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/ci/runner | Out-Null
          @(
            "Runner OS: $env:RUNNER_OS"
            "Runner architecture: $env:RUNNER_ARCH"
            "Image: $env:ImageOS"
            "Image version: $env:ImageVersion"
            "Commit: $env:GITHUB_SHA"
            "Run: $env:GITHUB_RUN_ID"
            "Attempt: $env:GITHUB_RUN_ATTEMPT"
          ) | Set-Content -Encoding utf8 build/ci/runner/environment.txt

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@f9e43010f1ae678f7cfa0542fe2a4f60f7d1ad8d # v3
        with:
          release: R2024b

      - name: Build MEX and run MATLAB tests
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3
        with:
          command: addpath(fullfile(pwd,'ci','matlab')); runMatlabCI

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: DataBionicIO-matlab-R2024b-windows-${{ github.run_attempt }}
          path: |
            build/ci/runner/
            build/ci/matlab/
          if-no-files-found: warn
          retention-days: 30
